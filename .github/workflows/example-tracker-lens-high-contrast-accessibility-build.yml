name: Example - Tracker Lens High-Contrast Accessibility Build
on:
  push:
    paths:
      - 'examples/tracker-lens/high-contrast-accessibility/**/*.gradle'
      - 'examples/tracker-lens/high-contrast-accessibility/**/*.properties'
      - 'examples/tracker-lens/high-contrast-accessibility/**/*.ndjson'
      - 'examples/tracker-lens/high-contrast-accessibility/**/libs.versions.toml'
      - '.github/workflows/example-tracker-lens-high-contrast-accessibility-build.yml'

jobs:
  Build-Example:
    name: Build Example
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build example
        run: |
          cd examples/tracker-lens/high-contrast-accessibility
          chmod +x ./gradlew
          ./gradlew generateTrackerLensDashboard --no-daemon
