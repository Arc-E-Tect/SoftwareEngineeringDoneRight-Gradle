name: Example - Doppelganger API Detector Property Helper Method Build
on:
  push:
    paths:
      - 'examples/doppelganger-api-detector/property-helper-method/**/*.java'
      - 'examples/doppelganger-api-detector/property-helper-method/**/*.yaml'
      - 'examples/doppelganger-api-detector/property-helper-method/**/*.gradle'
      - 'examples/doppelganger-api-detector/property-helper-method/**/*.properties'
      - 'examples/doppelganger-api-detector/property-helper-method/**/libs.versions.toml'
      - '.github/workflows/example-doppelganger-api-detector-property-helper-method-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Build-Example:
    name: Build Example
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Verify the real RestDocs test passes on its own
        run: |
          cd examples/doppelganger-api-detector/property-helper-method
          chmod +x ./gradlew
          ./gradlew test --no-daemon

      - name: Build example (expected to fail on the unverified listUsers endpoint)
        run: |
          cd examples/doppelganger-api-detector/property-helper-method

          set +e
          ./gradlew build --no-daemon
          EXIT_CODE=$?
          set -e

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "::error::Expected the property-helper-method example build to fail on the unverified listUsers endpoint, but it succeeded."
            exit 1
          fi

          echo "::notice::Build failed as expected: getUserByUsername resolved and verified via ApiEndpoints.get(...), listUsers caught as a doppelganger."
