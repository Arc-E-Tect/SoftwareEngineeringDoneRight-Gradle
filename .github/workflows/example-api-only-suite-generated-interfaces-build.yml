name: Example - API-Only Suite Generated Interfaces Build
on:
  push:
    paths:
      - 'examples/api-only-suite/generated-interfaces/**/*.java'
      - 'examples/api-only-suite/generated-interfaces/**/*.yaml'
      - 'examples/api-only-suite/generated-interfaces/**/*.gradle'
      - 'examples/api-only-suite/generated-interfaces/**/*.properties'
      - 'examples/api-only-suite/generated-interfaces/**/libs.versions.toml'
      - '.github/workflows/example-api-only-suite-generated-interfaces-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Build-Example:
    name: Build Example
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build, and verify all three detectors found the inherited endpoints
        run: |
          cd examples/api-only-suite/generated-interfaces
          chmod +x ./gradlew
          # check fails on any gap: failOnDetection, with check depending on all three detectors.
          ./gradlew build --no-daemon

          FAILED=0

          check_report() {
            local report="$1" expect="$2"
            local path="build/reports/${report}"
            if ! grep -q "$expect" "$path"; then
              echo "::error::Expected ${path} to say ${expect}"
              FAILED=1
            fi
          }

          check_report shadow-api-detector/shadow-apis.adoc 'Scanned 2 endpoint(s)'
          check_report mirage-api-detector/mirage-apis.adoc '0 of them are not implemented'
          check_report doppelganger-api-detector/doppelganger-apis.adoc 'Scanned 2 endpoint(s)'

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

          echo "::notice::All three detectors found both endpoints OrderController inherits from the generated OrdersApi."
