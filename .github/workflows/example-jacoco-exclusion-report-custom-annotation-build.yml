name: Example - JaCoCo Exclusion Report Custom Annotation Build
on:
  push:
    paths:
      - 'examples/jacoco-exclusion-report/custom-annotation/**/*.java'
      - 'examples/jacoco-exclusion-report/custom-annotation/**/*.gradle'
      - 'examples/jacoco-exclusion-report/custom-annotation/**/*.properties'
      - 'examples/jacoco-exclusion-report/custom-annotation/**/libs.versions.toml'
      - '.github/workflows/example-jacoco-exclusion-report-custom-annotation-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Build-Example:
    name: Build Example
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build example
        run: |
          cd examples/jacoco-exclusion-report/custom-annotation
          chmod +x ./gradlew
          ./gradlew build --no-daemon