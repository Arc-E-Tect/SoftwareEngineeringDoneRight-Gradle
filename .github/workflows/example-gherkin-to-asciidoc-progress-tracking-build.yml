name: Example - Gherkin to AsciiDoc Progress Tracking Build
on:
  push:
    paths:
      - 'examples/gherkin-to-asciidoc/progress-tracking/**/*.feature'
      - 'examples/gherkin-to-asciidoc/progress-tracking/**/*.java'
      - 'examples/gherkin-to-asciidoc/progress-tracking/**/*.gradle'
      - 'examples/gherkin-to-asciidoc/progress-tracking/**/*.properties'
      - 'examples/gherkin-to-asciidoc/progress-tracking/**/libs.versions.toml'
      - '.github/workflows/example-gherkin-to-asciidoc-progress-tracking-build.yml'

jobs:
  Build-Example:
    name: Build Example
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build example
        run: |
          cd examples/gherkin-to-asciidoc/progress-tracking
          chmod +x ./gradlew
          ./gradlew generateFeatureDocs build --no-daemon
