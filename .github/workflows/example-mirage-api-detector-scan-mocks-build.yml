name: Example - Mirage API Detector Scan Mocks Build
on:
  push:
    paths:
      - 'examples/mirage-api-detector/scan-mocks/**/*.java'
      - 'examples/mirage-api-detector/scan-mocks/**/*.yaml'
      - 'examples/mirage-api-detector/scan-mocks/**/*.json'
      - 'examples/mirage-api-detector/scan-mocks/**/*.gradle'
      - 'examples/mirage-api-detector/scan-mocks/**/*.properties'
      - 'examples/mirage-api-detector/scan-mocks/**/libs.versions.toml'
      - '.github/workflows/example-mirage-api-detector-scan-mocks-build.yml'

jobs:
  Build-Example:
    name: Build Example
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build example (expected to fail)
        run: |
          cd examples/mirage-api-detector/scan-mocks
          chmod +x ./gradlew

          set +e
          ./gradlew build --no-daemon
          EXIT_CODE=$?
          set -e

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "::error::Expected the scan-mocks example build to fail, but it succeeded."
            exit 1
          fi

          echo "::notice::Build failed as expected for the scan-mocks example."
