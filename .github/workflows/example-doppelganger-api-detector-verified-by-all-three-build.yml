name: Example - Doppelganger API Detector Verified By All Three Build
on:
  push:
    paths:
      - 'examples/doppelganger-api-detector/verified-by-all-three/**/*.java'
      - 'examples/doppelganger-api-detector/verified-by-all-three/**/*.yaml'
      - 'examples/doppelganger-api-detector/verified-by-all-three/**/*.groovy'
      - 'examples/doppelganger-api-detector/verified-by-all-three/**/*.gradle'
      - 'examples/doppelganger-api-detector/verified-by-all-three/**/*.properties'
      - 'examples/doppelganger-api-detector/verified-by-all-three/**/libs.versions.toml'
      - '.github/workflows/example-doppelganger-api-detector-verified-by-all-three-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Build-Example:
    name: Build Example
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Verify the two real verification tests pass on their own
        run: |
          cd examples/doppelganger-api-detector/verified-by-all-three
          chmod +x ./gradlew
          ./gradlew test --no-daemon

      - name: Build example (expected to fail on the one unverified endpoint)
        run: |
          cd examples/doppelganger-api-detector/verified-by-all-three

          set +e
          ./gradlew build --no-daemon
          EXIT_CODE=$?
          set -e

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "::error::Expected the verified-by-all-three example build to fail on the unverified deleteItem endpoint, but it succeeded."
            exit 1
          fi

          echo "::notice::Build failed as expected: three endpoints verified, one doppelganger caught."
