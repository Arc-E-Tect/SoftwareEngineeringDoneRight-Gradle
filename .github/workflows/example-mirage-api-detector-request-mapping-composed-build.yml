name: Example - Mirage API Detector Composed RequestMapping Build
on:
  push:
    paths:
      - 'examples/mirage-api-detector/request-mapping-composed/**/*.java'
      - 'examples/mirage-api-detector/request-mapping-composed/**/*.yaml'
      - 'examples/mirage-api-detector/request-mapping-composed/**/*.gradle'
      - 'examples/mirage-api-detector/request-mapping-composed/**/*.properties'
      - 'examples/mirage-api-detector/request-mapping-composed/**/libs.versions.toml'
      - '.github/workflows/example-mirage-api-detector-request-mapping-composed-build.yml'

jobs:
  Build-Example:
    name: Build Example
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build example
        run: |
          cd examples/mirage-api-detector/request-mapping-composed
          chmod +x ./gradlew
          ./gradlew detectMirageApis --no-daemon
