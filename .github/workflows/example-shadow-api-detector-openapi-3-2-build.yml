name: Example - Shadow API Detector OpenAPI 3.2 Build
on:
  push:
    paths:
      - 'shadow-api-detector/**/*.java'
      - 'shadow-api-detector/**/*.yaml'
      - 'shadow-api-detector/**/*.gradle'
      - 'shadow-api-detector/**/*.properties'
      - 'shadow-api-detector/**/libs.versions.toml'
      - 'examples/shadow-api-detector/openapi-3-2/**/*.java'
      - 'examples/shadow-api-detector/openapi-3-2/**/*.yaml'
      - 'examples/shadow-api-detector/openapi-3-2/**/*.gradle'
      - 'examples/shadow-api-detector/openapi-3-2/**/*.properties'
      - 'examples/shadow-api-detector/openapi-3-2/**/libs.versions.toml'
      - '.github/workflows/example-shadow-api-detector-openapi-3-2-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Build-Example:
    name: Build Example
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build example
        run: |
          cd examples/shadow-api-detector/openapi-3-2
          chmod +x ./gradlew
          ./gradlew detectShadowApis --no-daemon
