name: Example - Architecture Validator - Hexagonal Violations Build
on:
  push:
    paths:
      - 'examples/architecture-validator/hexagonal-violations/**/*.java'
      - 'examples/architecture-validator/hexagonal-violations/**/*.gradle'
      - 'examples/architecture-validator/hexagonal-violations/**/*.properties'
      - 'examples/architecture-validator/hexagonal-violations/**/libs.versions.toml'
      - '.github/workflows/example-architecture-validator-hexagonal-violations-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Build-Example:
    name: Build Example
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build example (expected to fail)
        run: |
          cd examples/architecture-validator/hexagonal-violations
          chmod +x ./gradlew

          set +e
          ./gradlew build --no-daemon
          EXIT_CODE=$?
          set -e

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "::error::Expected the hexagonal-violations example build to fail, but it succeeded."
            exit 1
          fi

          echo "::notice::Build failed as expected for the hexagonal-violations example."
