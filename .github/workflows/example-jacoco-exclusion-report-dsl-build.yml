name: Example - JaCoCo Exclusion Report DSL Build
on:
  push:
    paths:
      - 'examples/jacoco-exclusion-report/dsl/**/*.java'
      - 'examples/jacoco-exclusion-report/dsl/**/*.gradle'
      - 'examples/jacoco-exclusion-report/dsl/**/*.properties'
      - 'examples/jacoco-exclusion-report/dsl/**/libs.versions.toml'
      - '.github/workflows/example-jacoco-exclusion-report-dsl-build.yml'

jobs:
  Build-Example:
    name: Build Example
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build example
        run: |
          cd examples/jacoco-exclusion-report/dsl
          chmod +x ./gradlew
          ./gradlew build --no-daemon
