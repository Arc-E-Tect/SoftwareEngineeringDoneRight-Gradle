plugins {
    id 'java-library'
    id 'maven-publish'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.javaparser.core
    implementation libs.swagger.parser

    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
    testRuntimeOnly    libs.junit.platform.launcher
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}

// api-detector-core is still never published to any public repository (Gradle Plugin Portal,
// Maven Central, GitHub Packages) - it remains an internal library consumed via project(...) in
// this repo's own CI builds. This publication exists solely so shadow/mirage/doppelganger-api-detector's
// own `implementation project(':api-detector-core')` dependency resolves to something real when
// one of THEM is published to mavenLocal for local example testing - see each example's README.
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}
