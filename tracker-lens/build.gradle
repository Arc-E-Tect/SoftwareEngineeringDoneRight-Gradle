plugins {
    id 'java-gradle-plugin'
    id 'jacoco'
    id 'maven-publish'
    alias(libs.plugins.plugin.publish)
    alias(libs.plugins.owasp.dependency.check)
}

def pluginVersionForResources = project.version.toString()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    maven {
        name = 'GitHubPackages'
        url = uri('https://maven.pkg.github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Code')
        credentials {
            username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
            password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
        }
    }
    mavenCentral()
}

dependencyCheck {
    failBuildOnCVSS = (System.getenv('FAIL_ON_FATAL') == 'true') ? 9 : 11
    nvd {
        apiKey = System.getenv('NVD_APIKEY_SEDR')
    }
    analyzers {
        nodeAuditEnabled = false
        nodeEnabled = false
    }
}

dependencies {
    implementation libs.jsoup
    implementation libs.mustache
    implementation libs.dsl.updater.core

    testImplementation gradleTestKit()
    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
    testRuntimeOnly    libs.junit.platform.launcher
}

gradlePlugin {
    website = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Gradle/tree/main/tracker-lens'
    vcsUrl  = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Gradle.git'
    plugins {
        trackerLens {
            id                  = 'com.arc-e-tect.tracker-lens'
            implementationClass = 'com.arc_e_tect.gradle.trackerlens.TrackerLensPlugin'
            displayName         = 'Tracker Lens'
            description         = 'Generates a themeable, standalone HTML dashboard from Gherkin scenario and API contract lifecycle history, with a pluggable multi-lens style-pack system.'
            tags                = ['dashboard', 'reporting', 'gherkin', 'openapi', 'tracking']
            compatibility {
                features {
                    configurationCache = true
                }
            }
        }
    }
}

processResources {
    inputs.property('pluginVersion', pluginVersionForResources)
    filesMatching('tracker-lens.properties') {
        expand(pluginVersion: pluginVersionForResources)
    }
}

publishing {
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Code')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
            }
        }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required  = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.9
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

tasks.named("publishPlugins") {
    notCompatibleWithConfigurationCache("com.gradle.plugin-publish PublishTask does not support configuration cache")
}

// The published POM is what the Gradle Plugin Portal reads to describe this
// plugin. Without this it carries coordinates and nothing else -- no name, no
// description, and no licence -- so the artifact says nothing about its own terms
// while the repository is plainly MIT.
publishing {
    publications.withType(MavenPublication).configureEach {
        pom {
            name = 'Tracker Lens'
            description = 'Generates a themeable, standalone HTML dashboard from Gherkin scenario and API contract lifecycle history, with a pluggable multi-lens style-pack system.'
            url = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Gradle/tree/main/tracker-lens'

            licenses {
                license {
                    name = 'MIT License'
                    url = 'https://opensource.org/licenses/MIT'
                    distribution = 'repo'
                }
            }

            developers {
                developer {
                    id = 'arc-e-tect'
                    name = 'Arc-E-Tect'
                }
            }

            scm {
                url = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Gradle'
                connection = 'scm:git:https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Gradle.git'
                developerConnection = 'scm:git:git@github.com:Arc-E-Tect/SoftwareEngineeringDoneRight-Gradle.git'
            }
        }
    }
}

// Ship the licence inside the artifact, not only as a claim in its metadata.
tasks.named('jar') {
    from(layout.projectDirectory.file('LICENSE')) {
        into 'META-INF'
    }
}
