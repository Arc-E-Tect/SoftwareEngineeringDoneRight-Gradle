plugins {
    id 'java-gradle-plugin'
    id 'jacoco'
    id 'maven-publish'
    alias(libs.plugins.plugin.publish)
    alias(libs.plugins.owasp.dependency.check)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    maven {
        name = 'GitHubPackages'
        url = uri('https://maven.pkg.github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Code')
        credentials {
            username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
            password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
        }
    }
    mavenCentral()
}

dependencyCheck {
    failBuildOnCVSS = (System.getenv('FAIL_ON_FATAL') == 'true') ? 9 : 11
    nvd {
        apiKey = System.getenv('NVD_APIKEY_SEDR')
    }
    analyzers {
        nodeAuditEnabled = false
        nodeEnabled = false
    }
}

dependencies {
    // Transitively brings in api-detector-core - this module never references its classes
    // directly, only the three detector plugins' own Plugin/Extension classes.
    implementation project(':shadow-api-detector')
    implementation project(':mirage-api-detector')
    implementation project(':doppelganger-api-detector')

    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
    testRuntimeOnly    libs.junit.platform.launcher
}

gradlePlugin {
    website = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Gradle/tree/main/api-only-suite'
    vcsUrl  = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Gradle.git'
    plugins {
        apiOnlySuite {
            id                  = 'com.arc-e-tect.api-only-suite'
            implementationClass = 'com.arc_e_tect.gradle.suite.ApiOnlySuitePlugin'
            displayName         = 'Arc-E-Tect API-Only Suite'
            description         = 'Applies the Shadow, Mirage, and Doppelganger API Detector plugins together, so declared, implemented, and verified are all checked in one step.'
            tags                = ['spring-boot', 'openapi', 'rest', 'documentation', 'report', 'testing']
            compatibility {
                features {
                    configurationCache = true
                }
            }
        }
    }
}

publishing {
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Code')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
            }
        }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required  = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, excludes: [
                // Unlike the three detector plugins, ApiOnlySuitePlugin is not excluded here: it
                // holds this module's only real logic (the forwarding/precedence rules), whereas
                // ApiOnlySuiteExtension is pure Gradle-generated abstract-getter boilerplate.
                'com/arc_e_tect/gradle/suite/ApiOnlySuiteExtension.class',
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, excludes: [
                // Unlike the three detector plugins, ApiOnlySuitePlugin is not excluded here: it
                // holds this module's only real logic (the forwarding/precedence rules), whereas
                // ApiOnlySuiteExtension is pure Gradle-generated abstract-getter boilerplate.
                'com/arc_e_tect/gradle/suite/ApiOnlySuiteExtension.class',
            ])
        }))
    }
    violationRules {
        rule {
            limit {
                minimum = 0.9
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

tasks.named("publishPlugins") {
    notCompatibleWithConfigurationCache("com.gradle.plugin-publish PublishTask does not support configuration cache")
}
