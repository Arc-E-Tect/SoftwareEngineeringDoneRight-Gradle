plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id "de.fayard.refreshVersions" version "0.60.6"
}

refreshVersions {
    rejectVersionIf {
        candidate.stabilityLevel.isLessStableThan(current.stabilityLevel)
    }
}

rootProject.name = 'api-only-suite'

// A single Gradle build has exactly one settings.gradle - each sibling module's own settings.gradle
// is not honored once that module is pulled in here as a subproject, so every project(':...')
// dependency reachable from shadow/mirage/doppelganger's own build.gradle files must be declared
// directly in this settings.gradle too. (api-detector-core no longer needs an entry here - all
// three now depend on it as a published Maven Central artifact, not a project(...) dependency.)
include 'shadow-api-detector'
project(':shadow-api-detector').projectDir = file('../shadow-api-detector')

include 'mirage-api-detector'
project(':mirage-api-detector').projectDir = file('../mirage-api-detector')

include 'doppelganger-api-detector'
project(':doppelganger-api-detector').projectDir = file('../doppelganger-api-detector')
