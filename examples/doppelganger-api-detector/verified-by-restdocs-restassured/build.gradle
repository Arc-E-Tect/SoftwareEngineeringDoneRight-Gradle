plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.doppelganger.api.detector)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.spring.boot.starter.web

    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.restdocs.restassured
    testImplementation libs.rest.assured
}

test {
    useJUnitPlatform()
}

doppelgangerApiDetector {
    rootDocument = file('src/main/resources/openapi/openapi.yaml')

    // The plugin's default testDirs is src/testContract/java; this example's test lives in the
    // standard src/test/java source set so Gradle actually compiles and runs it.
    testDirs.from('src/test/java')

    // Fail the build if anything is still unverified. getItem is exercised by a real, passing
    // spring-restdocs-restassured test - see src/test/java - so this is expected to pass.
    failOnDoppelganger = true
}

// detectDoppelgangerApis is not wired into check/build automatically - opt in explicitly.
tasks.named('check') {
    dependsOn 'detectDoppelgangerApis'
}
