plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.doppelganger.api.detector)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
}

test {
    useJUnitPlatform()
}

doppelgangerApiDetector {
    rootDocument = file('src/main/resources/openapi/openapi.yaml')

    // Fail the build if anything is still unverified. getItem is exercised by a real, passing
    // Spring RestDocs test - see src/test/java - so this is expected to pass.
    failOnDoppelganger = true
}

// detectDoppelgangerApis is not wired into check/build automatically - opt in explicitly.
tasks.named('check') {
    dependsOn 'detectDoppelgangerApis'
}
