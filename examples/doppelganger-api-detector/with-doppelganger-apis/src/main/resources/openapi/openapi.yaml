openapi: 3.1.0
info:
  title: Ordering API
  version: "1.0"
paths:
  /orders:
    get:
      operationId: listOrders
      tags: [Orders]
      responses:
        '200':
          description: OK
    post:
      operationId: createOrder
      tags: [Orders]
      responses:
        '201':
          description: Created
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
