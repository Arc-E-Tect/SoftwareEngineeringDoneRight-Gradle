plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.doppelganger.api.detector)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation libs.rest.assured
    testImplementation libs.swagger.request.validator.restassured
}

test {
    useJUnitPlatform()
}

doppelgangerApiDetector {
    rootDocument = file('src/main/resources/openapi/openapi.yaml')

    // Only useRestDocs is enabled by default - opt in to the source this example demonstrates.
    useOpenApiRequestValidator = true

    // Fail the build if anything is still unverified. getItem is exercised by a real, passing
    // REST Assured test validated against the OpenAPI document - see src/test/java - so this is
    // expected to pass.
    failOnDoppelganger = true
}

// detectDoppelgangerApis is not wired into check/build automatically - opt in explicitly.
tasks.named('check') {
    dependsOn 'detectDoppelgangerApis'
}
