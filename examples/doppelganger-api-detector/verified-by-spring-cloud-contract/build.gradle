plugins {
    id 'java'
    alias(libs.plugins.doppelganger.api.detector)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.spring.web
}

doppelgangerApiDetector {
    rootDocument = file('src/main/resources/openapi/openapi.yaml')

    // The plugin's default contractsDir is src/testContract/resources/contracts; this example's
    // contract file lives under the standard src/test/resources/contracts path.
    contractsDir = file('src/test/resources/contracts')

    // Fail the build if anything is still unverified. Every endpoint here is covered by the
    // Spring Cloud Contract file under src/test/resources/contracts, so this is expected to pass.
    failOnDoppelganger = true
}

// detectDoppelgangerApis is not wired into check/build automatically - opt in explicitly.
tasks.named('check') {
    dependsOn 'detectDoppelgangerApis'
}
