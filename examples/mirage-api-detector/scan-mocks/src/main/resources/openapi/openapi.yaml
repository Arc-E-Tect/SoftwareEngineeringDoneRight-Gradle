openapi: 3.1.0
info:
  title: Catalog API
  version: "1.0"
paths:
  /items:
    get:
      operationId: listItems
      tags: [Items]
      responses:
        '200':
          description: OK
    post:
      operationId: createItem
      tags: [Items]
      responses:
        '201':
          description: Created
  /items/{id}:
    get:
      # A real ItemController.getItem(...) handler exists for this operation - but this example
      # runs in scanMocks mode, where controllers are never consulted. No WireMock stub exists
      # for this endpoint (see src/test/resources/mappings), so it is reported as a mirage API
      # despite being genuinely implemented.
      operationId: getItem
      tags: [Items]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
