openapi: 3.1.0
info:
  title: Invoicing API
  version: "1.0"
paths:
  /invoices:
    get:
      operationId: listInvoices
      tags: [Invoices]
      responses:
        '200':
          description: OK
    post:
      operationId: createInvoice
      tags: [Invoices]
      responses:
        '201':
          description: Created
  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [Invoices]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
    delete:
      # Written ahead of the implementation and never built - InvoiceController has no
      # matching handler. This is the mirage API this example is designed to catch.
      operationId: cancelInvoice
      tags: [Invoices]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No Content
