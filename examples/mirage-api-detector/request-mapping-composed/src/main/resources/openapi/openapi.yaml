openapi: 3.1.0
info:
  title: Library API
  version: "1.0"
paths:
  /library/books:
    get:
      operationId: listBooks
      tags: [Library]
      responses:
        '200':
          description: OK
    post:
      operationId: addBook
      tags: [Library]
      responses:
        '201':
          description: Created
  /library/books/{id}:
    get:
      operationId: getBook
      tags: [Library]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
