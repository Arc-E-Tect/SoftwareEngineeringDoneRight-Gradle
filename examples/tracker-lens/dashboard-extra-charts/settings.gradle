pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id "de.fayard.refreshVersions" version "0.60.6"
}

refreshVersions {
    rejectVersionIf {
        candidate.stabilityLevel.isLessStableThan(current.stabilityLevel)
    }
}

rootProject.name = 'tracker-lens-dashboard-extra-charts-example'

// Composite build: substitutes the lensStyle dependency in build.gradle with lens-colored-pack's
// own build output directly, so its "lens-colored" lens is available with no separate publish
// step - see lens-colored-pack/build.gradle and this project's own README for why.
includeBuild('lens-colored-pack')
