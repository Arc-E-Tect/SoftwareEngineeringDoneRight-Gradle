plugins {
    alias(libs.plugins.tracker.lens)
}

trackerLens {
    // Same structure and wording as the plugin's own bundled dashboard.html template - this
    // project-supplied copy only adds two extra, non-contract charts (see dashboard-template.html).
    template = file('dashboard-template.html')

    // Registered via lensStylesheet, so the switcher lists it under the plugin's fixed "custom-lens"
    // id rather than this file's own name - see lens-colored.css's own header comment for what it does.
    lensStylesheet = file('lens-colored.css')

    trackers {
        register('bdd-scenarios') {
            historyFiles.from(file('gherkin-progress-history.ndjson'))
            source = com.arc_e_tect.gradle.trackerlens.TrackerSourceKind.GHERKIN_SCENARIO
        }
        register('api-contracts') {
            historyFiles.from(file('api-contract-history.ndjson'))
            source = com.arc_e_tect.gradle.trackerlens.TrackerSourceKind.API_CONTRACT
        }
    }
}
