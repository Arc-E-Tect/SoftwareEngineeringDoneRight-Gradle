plugins {
    id 'java'
    alias(libs.plugins.gherkin.to.asciidoc)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Provides the @Given/@When/@Then annotations used by the glue code in
    // src/test/java/.../steps, so it compiles like real Cucumber-JVM step definitions.
    testImplementation libs.cucumber.java
}

test {
    // LoginSteps/InvoiceSteps are glue code for gherkinToAsciidoc's glueCodeDirs
    // scanning, not a JUnit test suite - there's nothing for the test task to
    // discover and run.
    failOnNoDiscoveredTests = false
}

gherkinToAsciidoc {
    // Two unrelated feature areas, each with its own feature file directory and
    // glue code directory, to demonstrate that sourceDirs/glueCodeDirs aggregate
    // across as many directories as configured.
    sourceDirs.from(
            'src/test/resources/features-auth',
            'src/test/resources/features-billing')
    glueCodeDirs.from(
            'src/test/java/com/arc_e_tect/example/auth/steps',
            'src/test/java/com/arc_e_tect/example/billing/steps')
    trackProgress = true
}
