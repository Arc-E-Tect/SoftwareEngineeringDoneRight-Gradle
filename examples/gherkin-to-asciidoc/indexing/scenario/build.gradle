import com.arc_e_tect.gradle.gherkin.indexing.IndexingMode

// The plugin is already applied to this project by the root project's `subprojects { }` block.
// This sub-project overrides indexing = IndexingMode.SCENARIO: every Scenario/Scenario Outline
// title in its (own copy of the) source .feature files is numbered continuously across both
// feature files, in the same alphabetical file order as FEATURE mode - while Feature titles are
// left untouched. Unlike FEATURE/ALL, SCENARIO does not require groupByFeature = true.
gherkinToAsciidoc {
    indexing = IndexingMode.SCENARIO
}
