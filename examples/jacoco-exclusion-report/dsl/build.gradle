plugins {
    id 'java'
    id 'jacoco'
    alias(libs.plugins.jacoco.exclusion.report)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

def jacocoExcludedPatterns = [
        'com/arc_e_tect/example/dsl/generated/**'
]

jacocoExclusionReport {
    includeConfiguredExclusions = true
}

jacocoTestReport {
    dependsOn test
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExcludedPatterns)
        }))
    }
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExcludedPatterns)
        }))
    }
}
