openapi: 3.1.0
info:
  title: Users Service API
  version: "1.0"
paths:
  /users/{id}:
    get:
      # Declared, implemented (UserController.getUser), and verified by
      # UserControllerValidatorTest - compliant.
      operationId: getUser
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
  /users:
    get:
      # Declared AND implemented (UserController.listUsers), but never verified - the
      # doppelganger API this service is designed to catch.
      operationId: listUsers
      tags: [Users]
      responses:
        '200':
          description: OK

# Note: UserController also implements GET /users/{id}/preferences, which has no description here
# at all - the shadow API this service is designed to catch.
