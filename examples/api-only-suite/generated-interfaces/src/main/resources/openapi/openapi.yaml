openapi: 3.0.3
info:
  title: Orders Service API
  version: "1.0"
paths:
  /v1/orders:
    get:
      # Generated into OrdersApi.listOrders, implemented by OrderController, verified by
      # OrderControllerValidatorTest.
      operationId: listOrders
      tags: [Orders]
      responses:
        '200':
          description: Every order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderV1'
  /v1/orders/{id}:
    get:
      # Generated into OrdersApi.getOrder, implemented by OrderController, verified by
      # OrderControllerValidatorTest.
      operationId: getOrder
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderV1'
components:
  schemas:
    OrderV1:
      type: object
      required: [id, status]
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [open, shipped]
