openapi: 3.1.0
info:
  title: Catalog API
  version: "1.0"
paths:
  /items:
    get:
      # Declared AND implemented (ItemController.listItems), but never verified - the
      # doppelganger API this example is designed to catch.
      operationId: listItems
      tags: [Items]
      responses:
        '200':
          description: OK
    post:
      # Declared, but ItemController has no createItem handler - the mirage API this example is
      # designed to catch.
      operationId: createItem
      tags: [Items]
      responses:
        '201':
          description: Created
