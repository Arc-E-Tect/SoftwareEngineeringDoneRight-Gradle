plugins {
    id 'java'
    id 'com.arc-e-tect.architecture-validator'
}

group = 'com.example.spring'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.spring.context.iff
}

architectureValidator {
    basePackage = 'com.example.spring'
    ignoreFailures = true
    useSpringRulePack = true
    springRulePackCoordinate = 'com.arc-e-tect:spring-rules'
}