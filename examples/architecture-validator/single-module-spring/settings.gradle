pluginManagement {
    includeBuild('../../../architecture-validator')
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'de.fayard.refreshVersions' version '0.60.6'
}

refreshVersions {
    rejectVersionIf {
        candidate.stabilityLevel.isLessStableThan(current.stabilityLevel)
    }
}

includeBuild('../../../architecture-validator')

rootProject.name = 'architecture-validator-single-module-spring'
