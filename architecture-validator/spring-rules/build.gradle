plugins {
    id 'java-library'
    id 'maven-publish'
    alias(libs.plugins.jreleaser.iff)
}

group = rootProject.group
version = rootProject.version

base {
    archivesName = 'architecture-validator-hexagonal-spring-rules'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    api libs.archunit.junit5.iff
    compileOnly libs.spring.context.iff
    compileOnly libs.junit.jupiter.iff

    testImplementation libs.junit.jupiter.iff
    testRuntimeOnly libs.junit.platform.launcher.iff
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'architecture-validator-hexagonal-spring-rules'
            pom {
                name = 'Architecture Validation Spring Rules'
                description = 'Companion Spring Hexagonal architecture rules for the Architecture Validator plugin. Add com.arc-e-tect:architecture-validator-hexagonal-spring-rules as a testArchitectureImplementation dependency to activate Spring stereotype rules.'
                url = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Gradle'
                inceptionYear = '2026'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id = 'ieising'
                        name = 'Iwan Eising'
                        email = 'iwan@arc-e-tect.com'
                        organizationUrl = 'https://github.com/Arc-E-Tect'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Gradle.git'
                    developerConnection = 'scm:git:ssh://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Gradle.git'
                    url = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Gradle'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Code')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
            }
        }
        maven {
            name = 'StagingDeploy'
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}

jreleaser {
    gitRootSearch = true
    signing {
        active = 'ALWAYS'
        armored = true
        mode = 'MEMORY'
    }
    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'RELEASE'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepositories = ['build/staging-deploy']
                }
            }
        }
    }
}

test {
    useJUnitPlatform()
}

tasks.withType(Javadoc).configureEach {
    options.memberLevel = org.gradle.external.javadoc.JavadocMemberLevel.PACKAGE
}