plugins {
    id 'java-gradle-plugin'
    id 'jacoco'
    id 'maven-publish'
    alias(libs.plugins.plugin.publish)
    alias(libs.plugins.owasp.dependency.check)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    maven {
        name = 'GitHubPackages'
        url = uri('https://maven.pkg.github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Code')
        credentials {
            username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
            password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
        }
    }
    mavenCentral()
}

dependencyCheck {
    failBuildOnCVSS = (System.getenv('FAIL_ON_FATAL') == 'true') ? 9 : 11
    nvd {
        apiKey = System.getenv('NVD_APIKEY_SEDR')
    }
    analyzers {
        nodeAuditEnabled = false
        nodeEnabled = false
    }
}

dependencies {
    implementation libs.api.detector.core
    implementation libs.dsl.updater.core
    implementation libs.javaparser.core
    implementation libs.swagger.parser
    implementation libs.snakeyaml

    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
    testRuntimeOnly    libs.junit.platform.launcher
}

gradlePlugin {
    website = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Gradle/tree/main/doppelganger-api-detector'
    vcsUrl  = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Gradle.git'
    plugins {
        doppelgangerApiDetector {
            id                  = 'com.arc-e-tect.doppelganger-api-detector'
            implementationClass = 'com.arc_e_tect.gradle.doppelganger.DoppelgangerApiDetectorPlugin'
            displayName         = 'Doppelganger API Detector'
            description         = 'Scans OpenAPI documentation, @RestController implementations, and test-level verification evidence (Spring RestDocs, the Atlassian OpenAPI request validator, and Spring Cloud Contract) to report endpoints that are declared and implemented but never verified against their contract.'
            tags                = ['spring-boot', 'openapi', 'rest', 'documentation', 'report', 'testing']
            compatibility {
                features {
                    configurationCache = true
                }
            }
        }
    }
}

publishing {
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Code')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
            }
        }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required  = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, excludes: [
                'com/arc_e_tect/gradle/doppelganger/DoppelgangerApiDetectorExtension.class',
                'com/arc_e_tect/gradle/doppelganger/DoppelgangerApiDetectorPlugin.class',
                'com/arc_e_tect/gradle/doppelganger/DetectDoppelgangerApisTask.class',
                'com/arc_e_tect/gradle/doppelganger/ScanContractsTask.class',
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, excludes: [
                'com/arc_e_tect/gradle/doppelganger/DoppelgangerApiDetectorExtension.class',
                'com/arc_e_tect/gradle/doppelganger/DoppelgangerApiDetectorPlugin.class',
                'com/arc_e_tect/gradle/doppelganger/DetectDoppelgangerApisTask.class',
                'com/arc_e_tect/gradle/doppelganger/ScanContractsTask.class',
            ])
        }))
    }
    violationRules {
        rule {
            limit {
                minimum = 0.9
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

tasks.named("publishPlugins") {
    notCompatibleWithConfigurationCache("com.gradle.plugin-publish PublishTask does not support configuration cache")
}

// The published POM is what the Gradle Plugin Portal reads to describe this
// plugin. Without this it carries coordinates and nothing else -- no name, no
// description, and no licence -- so the artifact says nothing about its own terms
// while the repository is plainly MIT.
publishing {
    publications.withType(MavenPublication).configureEach {
        pom {
            name = 'Doppelganger API Detector'
            description = 'Scans OpenAPI documentation, @RestController implementations, and test-level verification evidence (Spring RestDocs, the Atlassian OpenAPI request validator, and Spring Cloud Contract) to report endpoints that are declared and implemented but never verified against their contract.'
            url = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Gradle/tree/main/doppelganger-api-detector'

            licenses {
                license {
                    name = 'MIT License'
                    url = 'https://opensource.org/licenses/MIT'
                    distribution = 'repo'
                }
            }

            developers {
                developer {
                    id = 'arc-e-tect'
                    name = 'Arc-E-Tect'
                }
            }

            scm {
                url = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Gradle'
                connection = 'scm:git:https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-Gradle.git'
                developerConnection = 'scm:git:git@github.com:Arc-E-Tect/SoftwareEngineeringDoneRight-Gradle.git'
            }
        }
    }
}

// Ship the licence inside the artifact, not only as a claim in its metadata.
tasks.named('jar') {
    from(layout.projectDirectory.file('LICENSE')) {
        into 'META-INF'
    }
}
